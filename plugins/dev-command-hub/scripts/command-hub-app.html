<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Command Hub</title>
  <style>
    :root {
      --bg-primary: var(--color-background-primary, #0d1117);
      --bg-secondary: var(--color-background-secondary, #161b22);
      --bg-tertiary: var(--color-background-tertiary, #21262d);
      --txt-primary: var(--color-text-primary, #e6edf3);
      --txt-secondary: var(--color-text-secondary, #9da7b3);
      --txt-tertiary: var(--color-text-tertiary, #7d8590);
      --bd-primary: var(--color-border-primary, rgba(255, 255, 255, 0.14));
      --bd-secondary: var(--color-border-secondary, rgba(255, 255, 255, 0.08));
      --glass-card-bg: color-mix(in srgb, var(--bg-secondary) 78%, transparent);
      --glass-rim: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 6px 18px -12px rgba(0, 0, 0, 0.55);
      --accent-primary: var(--color-ring-primary, #58a6ff);
      --accent-warn: var(--color-text-warning, #e3b341);
      --accent-ok: var(--color-text-success, #3fb950);
      --cat-1: #60a5fa;
      --cat-2: #a78bfa;
      --cat-3: #34d399;
      --cat-4: #fbbf24;
      --cat-5: #38bdf8;
      --cat-6: #ec4899;
      --font-ui: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    }
    :root[data-theme="light"] {
      --bg-primary: var(--color-background-primary, #f4f6f9);
      --bg-secondary: var(--color-background-secondary, #ffffff);
      --bg-tertiary: var(--color-background-tertiary, #eaedf2);
      --txt-primary: var(--color-text-primary, #18181b);
      --txt-secondary: var(--color-text-secondary, #52525b);
      --txt-tertiary: var(--color-text-tertiary, #71717a);
      --bd-primary: var(--color-border-primary, rgba(15, 23, 42, 0.11));
      --bd-secondary: var(--color-border-secondary, rgba(15, 23, 42, 0.07));
      --glass-card-bg: color-mix(in srgb, var(--bg-secondary) 86%, transparent);
      --glass-rim: rgba(255, 255, 255, 0.92);
      --glass-shadow: 0 6px 18px -12px rgba(15, 23, 42, 0.14);
      --accent-primary: var(--color-ring-primary, #2563eb);
      --accent-warn: var(--color-text-warning, #b45309);
      --accent-ok: var(--color-text-success, #15803d);
      --cat-1: #2563eb;
      --cat-2: #7c3aed;
      --cat-3: #059669;
      --cat-4: #d97706;
      --cat-5: #0284c7;
      --cat-6: #db2777;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-primary: var(--color-background-primary, #f4f6f9);
        --bg-secondary: var(--color-background-secondary, #ffffff);
        --bg-tertiary: var(--color-background-tertiary, #eaedf2);
        --txt-primary: var(--color-text-primary, #18181b);
        --txt-secondary: var(--color-text-secondary, #52525b);
        --txt-tertiary: var(--color-text-tertiary, #71717a);
        --bd-primary: var(--color-border-primary, rgba(15, 23, 42, 0.11));
        --bd-secondary: var(--color-border-secondary, rgba(15, 23, 42, 0.07));
        --glass-card-bg: color-mix(in srgb, var(--bg-secondary) 86%, transparent);
        --glass-rim: rgba(255, 255, 255, 0.92);
        --glass-shadow: 0 6px 18px -12px rgba(15, 23, 42, 0.14);
        --accent-primary: var(--color-ring-primary, #2563eb);
        --accent-warn: var(--color-text-warning, #b45309);
        --accent-ok: var(--color-text-success, #15803d);
        --cat-1: #2563eb;
        --cat-2: #7c3aed;
        --cat-3: #059669;
        --cat-4: #d97706;
        --cat-5: #0284c7;
        --cat-6: #db2777;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.42;
      color: var(--txt-primary);
      background:
        radial-gradient(560px 260px at 8% -5%, color-mix(in srgb, var(--cat-1) 13%, transparent), transparent 72%),
        radial-gradient(520px 260px at 92% -5%, color-mix(in srgb, var(--cat-6) 11%, transparent), transparent 72%),
        var(--bg-primary);
      min-height: 100%;
      overflow-x: hidden;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .hidden { display: none !important; }
    button { font-family: inherit; cursor: pointer; }

    /* Sticky glass header */
    .glass-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--bg-primary) 82%, transparent);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border-bottom: 1px solid var(--bd-secondary);
    }
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    body[data-mode="mini"] .header-inner {
      padding: 8px 12px;
      gap: 6px;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--bd-primary);
      background: linear-gradient(135deg, color-mix(in srgb, var(--cat-1) 24%, var(--bg-secondary)), color-mix(in srgb, var(--cat-2) 22%, var(--bg-secondary)));
      color: var(--accent-primary);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-tools {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .tool-btn {
      border: 1px solid var(--bd-primary);
      background: color-mix(in srgb, var(--bg-secondary) 78%, transparent);
      color: var(--txt-secondary);
      font-size: 12px;
      padding: 3px 7px;
      border-radius: 7px;
      transition: all 140ms ease;
      white-space: nowrap;
    }
    .tool-btn:hover { color: var(--txt-primary); border-color: var(--accent-primary); }
    .tool-btn.is-active {
      background: color-mix(in srgb, var(--accent-primary) 18%, var(--bg-tertiary));
      border-color: var(--accent-primary);
      color: var(--txt-primary);
      font-weight: 600;
    }

    .seg-group {
      display: inline-flex;
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--bd-primary);
      background: color-mix(in srgb, var(--bg-secondary) 75%, transparent);
      gap: 2px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--txt-secondary);
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 6px;
      transition: all 140ms ease;
    }
    .seg-btn.is-active {
      background: color-mix(in srgb, var(--accent-primary) 20%, var(--bg-tertiary));
      color: var(--txt-primary);
      font-weight: 600;
    }

    .search-wrap { position: relative; width: 100%; }
    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--txt-tertiary);
      pointer-events: none;
    }
    .glass-input {
      width: 100%;
      border-radius: 9px;
      border: 1px solid var(--bd-primary);
      background: color-mix(in srgb, var(--bg-secondary) 86%, transparent);
      color: var(--txt-primary);
      padding: 6px 9px;
      font-size: 12px;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .search-wrap .glass-input { padding-left: 28px; padding-right: 46px; }
    .glass-input::placeholder { color: var(--txt-tertiary); }
    .glass-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 18%, transparent);
    }
    .kbd-hint, .clear-btn {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: var(--txt-secondary);
      border: 1px solid var(--bd-primary);
      background: var(--bg-tertiary);
      border-radius: 6px;
      padding: 0 6px;
    }
    .kbd-hint { pointer-events: none; }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .scroll-pills {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      max-width: 100%;
    }
    .scroll-pills::-webkit-scrollbar { display: none; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 7px;
      border: 1px solid var(--bd-primary);
      background: color-mix(in srgb, var(--bg-secondary) 76%, transparent);
      color: var(--txt-secondary);
      font-size: 12px;
      white-space: nowrap;
      transition: all 140ms ease;
    }
    .pill:hover { color: var(--txt-primary); border-color: color-mix(in srgb, var(--accent-primary) 45%, var(--bd-primary)); }
    .pill.is-active {
      background: color-mix(in srgb, var(--accent-primary) 16%, var(--bg-secondary));
      border-color: color-mix(in srgb, var(--accent-primary) 55%, transparent);
      color: var(--txt-primary);
      font-weight: 500;
    }
    .dot { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; }
    .muted-num { opacity: 0.72; }

    /* Main container */
    .main-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 12px 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Drawers */
    .drawer-card {
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .drawer-title { font-size: 13px; font-weight: 600; }
    .form-grid { display: flex; flex-direction: column; gap: 6px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .check-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--txt-secondary);
      cursor: pointer;
    }

    /* Pinned favorites + recent */
    .pinned-inner {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border-radius: 11px;
      border: 1px solid var(--bd-primary);
      background: var(--glass-card-bg);
      box-shadow: inset 0 1px 0 var(--glass-rim);
      backdrop-filter: blur(16px);
    }
    .pinned-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--txt-secondary);
      white-space: nowrap;
    }
    .pinned-list {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pinned-list::-webkit-scrollbar { display: none; }
    .pin-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 7px;
      border-radius: 7px;
      border: 1px solid var(--bd-primary);
      background: color-mix(in srgb, var(--accent-primary) 12%, var(--bg-tertiary));
      color: var(--txt-primary);
      font-size: 12px;
      white-space: nowrap;
    }
    .pin-chip:hover { border-color: var(--accent-primary); }
    .pin-chip.is-armed {
      background: #d97706;
      border-color: #b45309;
      color: #ffffff;
    }

    /* Section headings */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .sec-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--txt-secondary);
      margin: 0;
    }
    .count-pill {
      font-size: 12px;
      padding: 0 7px;
      border-radius: 999px;
      border: 1px solid var(--bd-primary);
      background: var(--bg-secondary);
      color: var(--txt-secondary);
    }

    /* Glass cards */
    .glass-card, .glass-hero {
      position: relative;
      border-radius: 13px;
      border: 1px solid var(--bd-primary);
      background: var(--glass-card-bg);
      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);
      box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow);
      transition: border-color 150ms ease, background-color 150ms ease;
    }
    .glass-card:hover, .glass-hero:hover {
      border-color: color-mix(in srgb, var(--accent-primary) 45%, var(--bd-primary));
    }

    /* Workflows: Mini (with exposed send button!) & Full */
    .wf-mini-wrap { display: flex; flex-direction: column; gap: 7px; }
    .wf-mini-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .wf-mini-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 7px 8px;
      border-radius: 11px;
      border: 1px solid var(--bd-primary);
      background: var(--glass-card-bg);
      box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow);
      min-width: 0;
    }
    .wf-mini-card.is-active { border-color: var(--accent-primary); }
    .wf-mini-head {
      border: none;
      background: transparent;
      padding: 0;
      color: var(--txt-primary);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .wf-mini-top {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }
    .wf-mini-alias { font-size: 12px; font-weight: 600; }
    .wf-chev { margin-left: auto; font-size: 12px; color: var(--txt-tertiary); }
    .wf-mini-name {
      font-size: 12px;
      color: var(--txt-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wf-face-btn { width: 100%; text-align: center; }
    .wf-mini-drawer { padding: 10px; display: flex; flex-direction: column; gap: 7px; }
    .wf-mini-desc { font-size: 12px; color: var(--txt-secondary); }

    .wf-full-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
    @media (max-width: 860px) { .wf-full-grid { grid-template-columns: 1fr; } }
    .glass-hero {
      padding: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 9px;
      overflow: hidden;
    }
    .hero-accent { position: absolute; left: 0; right: 0; top: 0; height: 2px; }
    .hero-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .hero-title-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .alias-badge {
      font-size: 13px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 7px;
      border: 1px solid var(--bd-primary);
      background: var(--bg-tertiary);
    }
    .hero-title { margin: 0; font-size: 14px; font-weight: 600; }
    .hero-sub { margin: 3px 0 0; font-size: 12px; color: var(--txt-secondary); }
    .wf-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .step-pill {
      font-size: 12px;
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid var(--bd-secondary);
      background: var(--bg-tertiary);
    }
    .step-arrow { color: var(--txt-tertiary); font-size: 12px; }
    .hero-actions { display: flex; flex-direction: column; gap: 7px; padding-top: 7px; border-top: 1px solid var(--bd-secondary); }

    /* Commands: Mini 1-col & Full 2-col */
    .cmd-mini-list { display: flex; flex-direction: column; gap: 7px; }
    .cmd-full-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    @media (max-width: 640px) { .cmd-full-grid { grid-template-columns: 1fr; } }

    .cmd-card { padding: 9px 11px 9px 13px; cursor: pointer; overflow: hidden; }
    .cmd-card.is-open { border-color: var(--accent-primary); }
    .cat-stripe {
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      opacity: 0.88;
    }
    .cmd-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .cmd-title-wrap { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .cmd-name-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cmd-name { font-size: 13px; font-weight: 600; color: var(--txt-primary); }
    .cmd-alias { font-size: 12px; color: var(--txt-tertiary); }
    .badge-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

    .env-badge {
      font-size: 12px;
      padding: 0 6px;
      border-radius: 999px;
      border: 1px solid var(--bd-primary);
      background: var(--bg-tertiary);
      color: var(--txt-secondary);
      white-space: nowrap;
    }
    .env-badge.is-uni {
      border-color: color-mix(in srgb, var(--accent-ok) 45%, transparent);
      background: color-mix(in srgb, var(--accent-ok) 13%, transparent);
      color: var(--txt-primary);
    }
    .env-badge.is-app {
      border-color: color-mix(in srgb, var(--cat-3) 45%, transparent);
      background: color-mix(in srgb, var(--cat-3) 13%, transparent);
      color: var(--txt-primary);
    }
    .env-badge.is-cli {
      border-color: color-mix(in srgb, var(--cat-4) 45%, transparent);
      background: color-mix(in srgb, var(--cat-4) 13%, transparent);
      color: var(--txt-primary);
    }
    .env-badge.is-warn {
      border-color: color-mix(in srgb, var(--accent-warn) 50%, transparent);
      background: color-mix(in srgb, var(--accent-warn) 15%, transparent);
      color: var(--txt-primary);
    }
    .env-badge.is-paid {
      border-color: color-mix(in srgb, var(--cat-2) 50%, transparent);
      background: color-mix(in srgb, var(--cat-2) 14%, transparent);
      color: var(--txt-primary);
    }
    .env-badge.is-custom, .env-badge.is-prompt {
      border-color: color-mix(in srgb, var(--cat-6) 48%, transparent);
      background: color-mix(in srgb, var(--cat-6) 14%, transparent);
      color: var(--txt-primary);
    }

    .cmd-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .star-btn {
      border: none;
      background: transparent;
      color: var(--txt-tertiary);
      padding: 3px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .star-btn:hover { background: var(--bg-tertiary); color: var(--txt-primary); }
    .star-btn.is-fav { color: var(--accent-warn); }

    .cmd-summary {
      margin: 5px 0 0;
      font-size: 12px;
      color: var(--txt-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cmd-drawer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--bd-secondary);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .preview-box {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--bd-secondary);
      background: var(--bg-primary);
      font-size: 12px;
      word-break: break-all;
      white-space: pre-wrap;
    }

    /* Buttons */
    .btn-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .btn, .btn-xs {
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--bd-primary);
      transition: all 140ms ease;
    }
    .btn { padding: 4px 10px; }
    .btn-xs { padding: 2px 7px; }
    .btn-primary { background: var(--accent-primary); border-color: var(--accent-primary); color: #ffffff; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-confirm-warn { background: #d97706; border-color: #b45309; color: #ffffff; font-weight: 600; }
    .btn-confirm-warn:hover { background: #b45309; }
    .btn-secondary { background: var(--bg-tertiary); color: var(--txt-primary); }
    .btn-secondary:hover { border-color: var(--accent-primary); }
    .btn-ghost { background: transparent; color: var(--txt-secondary); }
    .btn-ghost:hover { color: var(--txt-primary); background: var(--bg-tertiary); }

    .empty-box { padding: 26px 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .empty-title { margin: 0; font-size: 14px; font-weight: 600; }
    .empty-sub { margin: 0; font-size: 12px; color: var(--txt-secondary); }

    /* Toast */
    .toast {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 60;
      max-width: min(350px, calc(100vw - 24px));
      padding: 7px 11px;
      border-radius: 10px;
      border: 1px solid var(--bd-primary);
      background: color-mix(in srgb, var(--bg-secondary) 94%, transparent);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: var(--glass-shadow);
      font-size: 12px;
    }
    .toast-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent-ok); flex-shrink: 0; }
    .toast-dot[data-tone="warn"] { background: var(--accent-warn); }
    .toast-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body data-mode="mini">
  <header class="glass-bar">
    <div class="header-inner">
      <div class="top-row">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5L5 19" /><path d="M13 8l5 4-5 4" />
            </svg>
          </div>
          <h1 class="brand-title">Dev Command Hub</h1>
        </div>
        <div class="top-tools">
          <button id="toggle-editor-btn" type="button" class="tool-btn">+ 新增</button>
          <button id="toggle-backup-btn" type="button" class="tool-btn">备份</button>
          <div id="density-toggle" class="seg-group" aria-label="视图密度"></div>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <input id="search-input" type="text" autocomplete="off" placeholder="搜中文场景、自定义项或指令（如：回退、并行、/cs）" class="glass-input" />
        <button id="clear-search-btn" type="button" class="clear-btn hidden">清空</button>
        <span id="search-kbd-hint" class="kbd-hint mono">/</span>
      </div>

      <div class="filter-row">
        <div id="category-tabs" class="scroll-pills"></div>
        <div id="env-pills" class="scroll-pills"></div>
      </div>
    </div>
  </header>

  <main class="main-wrap">
    <section id="top-drawer" class="hidden" aria-label="编辑与备份抽屉"></section>
    <section id="pinned-bar" class="hidden" aria-label="常用收藏与最近使用"></section>

    <section aria-labelledby="wf-heading">
      <div class="sec-head">

        <span class="count-pill">3 套</span>
      </div>
      <div id="workflows-grid"></div>
    </section>

    <section aria-labelledby="cmd-heading">
      <div class="sec-head">
        <h2 id="cmd-heading" class="sec-title">全量指令与模板库</h2>
        <span id="visible-count" class="count-pill">24 / 24</span>
      </div>
      <div id="commands-grid"></div>
      <div id="empty-state" class="hidden glass-card empty-box">
        <p class="empty-title">没有匹配的指令</p>
        <p class="empty-sub">试试搜索中文动词（如“搜索”“对比”“记忆”）或重置筛选。</p>
        <button id="reset-filters-btn" type="button" class="btn btn-primary">重置筛选</button>
      </div>
    </section>
  </main>

    <span id="toast-dot" class="toast-dot"></span>
